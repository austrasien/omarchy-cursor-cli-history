# History sidecar (org.omarchy.agent-history). Same theme, font, and
# palette as Cursor CLI (agent.ini → foot.ini). No extra top pad: the
# title overlay only covers org.omarchy.agent.
include=~/.config/foot/foot.ini

pad=14x14

[key-bindings]
scrollback-up-page=none
scrollback-down-page=none
scrollback-up-half-page=none
scrollback-down-half-page=none
scrollback-home=none
scrollback-end=none

[mouse-bindings]
scrollback-up-mouse=none
scrollback-down-mouse=none
