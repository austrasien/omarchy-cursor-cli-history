# Cursor CLI only (cursor-cli.desktop). Keeps the composer on-screen:
# Foot scrollback is empty (cursor-agent alt-screen + clears it), so
# scroll gestures open the JSONL history overlay on top of this window.
include=~/.config/foot/foot.ini

# Top pad matches austraz.agent-title overlay height so the TUI starts
# under the conversation subject instead of being covered by it.
# foot 1.26+: RIGHTxTOPxLEFTxBOTTOM (commas are invalid).
pad=14x22x14x14

[key-bindings]
scrollback-up-page=none
scrollback-down-page=none
scrollback-up-half-page=none
scrollback-down-half-page=none
scrollback-home=none
scrollback-end=none
# Shift+PageUp / Ctrl+Shift+H: open (or focus) history overlay.
pipe-scrollback=[/home/austraz/.config/omarchy/bin/agent-history-view --open] Shift+Page_Up Control+Shift+h

[mouse-bindings]
scrollback-up-mouse=none
scrollback-down-mouse=none
# Wheel up → same overlay (Cursor CLI ignores wheel for conversation).
pipe-scrollback=[/home/austraz/.config/omarchy/bin/agent-history-view --open] BTN_WHEEL_BACK
