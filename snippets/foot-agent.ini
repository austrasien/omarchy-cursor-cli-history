# Optional. Cursor CLI Foot windows only (point cursor-cli.desktop at
# --config=~/.config/foot/agent.ini). Disables Foot scrollback so the
# composer stays on screen; Alt+H still comes from Hyprland.
include=~/.config/foot/foot.ini

[key-bindings]
scrollback-up-page=none
scrollback-down-page=none
scrollback-up-half-page=none
scrollback-down-half-page=none
scrollback-home=none
scrollback-end=none

[mouse-bindings]
scrollback-up-mouse=none
scrollback-down-mouse=none
